[package]
name = "synthetic-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic synthetic MCP lab for passive discovery proofs"
publish = false

[lib]
name = "synthetic_mcp"
path = "src/lib.rs"

[[bin]]
name = "synthetic-mcp"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { workspace = true, features = [
    "server",
    "transport-async-rw",
    "transport-io",
    "transport-streamable-http-server",
] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "io-std", "io-util", "sync", "net"] }

[dev-dependencies]
rmcp = { workspace = true, features = [
    "client",
    "server",
    "transport-async-rw",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-server",
] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "process", "time"] }
