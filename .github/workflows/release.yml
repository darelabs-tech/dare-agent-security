name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0-rc2); required for manual dispatch"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RUST_VERSION: "1.88"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static (musl): they run on any distribution
          # release, not only on glibc >= the runner's.
          - os: ubuntu-latest
            target: linux-x86_64
            triple: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            triple: aarch64-unknown-linux-musl
          # The Intel macOS runner is retired: cross-compile on Apple silicon.
          - os: macos-14
            target: macos-x86_64
            triple: x86_64-apple-darwin
          - os: macos-14
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Add Rust target
        if: matrix.triple != ''
        run: rustup target add ${{ matrix.triple }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: bash ./scripts/release/package.sh ${{ matrix.target }} ${{ matrix.triple }}

      - name: Smoke-test the packaged binary
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          BIN=$(ls dist/*/dare-agent-security)
          file "$BIN" | tee /dev/stderr | grep -q 'static'
          "$BIN" --version

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: ./scripts/release/package.ps1 -Target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          pattern: dist-*
          merge-multiple: true

      - name: Build SHA256SUMS
        working-directory: dist-all
        run: |
          rm -f SHA256SUMS
          cat *.sha256 | sort -k2 > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        run: cargo cyclonedx --format json --all --describe binaries

      - name: Collect SBOM
        run: |
          mkdir -p dist-all
          find . -maxdepth 3 -name "*.cdx.json" -exec cp {} dist-all/ \;

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist-all/*.tar.gz
            dist-all/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ contains(steps.tag.outputs.tag, '-rc') || contains(steps.tag.outputs.tag, '-alpha') || contains(steps.tag.outputs.tag, '-beta') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-all/*.tar.gz
            dist-all/*.zip
            dist-all/SHA256SUMS
            dist-all/*.cdx.json
