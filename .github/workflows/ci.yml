name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Cycle 003 coaz-integrity: offline schema validation, secure/vulnerable
      # vector matrix, secret canaries, standards snapshot, and operator docs
      # are asserted by the workspace test suite (no extra job required).
      - name: Test
        run: cargo test --workspace
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit
