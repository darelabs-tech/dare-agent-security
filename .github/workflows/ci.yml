name: ci

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit

  lab-corpus:
    name: Cycle 005 lab corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run secure/vulnerable corpus matrix
        run: cargo test -p dare-mcp-lab --test corpus_scenarios -- --nocapture
      - name: Assert expected FAIL yields scenario PASS
        run: |
          cargo test -p dare-mcp-lab mcp_lab_004_005_006_integrity_via_coaz_engine -- --nocapture
      - name: Hostile fixtures
        run: cargo test -p dare-mcp-lab --test hostile_fixtures -- --nocapture

  coverage-engine:
    name: Cycle 006 coverage engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Coverage fixtures and adversarial tests
        run: cargo test -p dare-coverage -- --nocapture
      - name: Cycle 005 adapter mapping
        run: cargo test -p dare-coverage --test cycle005_adapter -- --nocapture

  benchmark-methodology:
    name: Cycle 007 benchmark methodology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Benchmark schemas, pilot, and safety tests
        run: cargo test -p dare-benchmark -- --nocapture
      - name: Offline pilot CLI
        run: |
          cargo run -p dare-agent-security -- validate benchmark \
            --corpus benchmark/corpus/pilot-methodology-v1/corpus-manifest.json \
            --output-dir .dare-agent-security/benchmark-ci \
            --mode local-passive

  attack-graph-mvp:
    name: Cycle 008 attack graph MVP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Attack graph fixtures and safety tests
        run: cargo test -p dare-attack-graph -- --nocapture
      - name: Offline attack graph CLI
        run: |
          cargo run -p dare-agent-security -- validate attack-graph \
            --facts fixtures/attack-graph/safe-read.json \
            --output-dir .dare-agent-security/attack-graph-ci

  adversarial-validation:
    name: Cycle 009 controlled adversarial validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Adversarial fixtures and security gates
        run: cargo test -p dare-adversarial -- --nocapture
      - name: Offline local synthetic CLI
        run: |
          cargo run -p dare-agent-security -- validate adversarial \
            --fixture fixtures/adversarial/confused-deputy.json \
            --mode local-synthetic \
            --output-dir .dare-agent-security/adversarial-ci

  continuous-validation:
    name: Cycle 010 continuous security validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Continuous fixtures and security gates
        run: cargo test -p dare-continuous -- --nocapture
      - name: Offline incremental plan
        run: |
          cargo run -p dare-agent-security -- validate continuous \
            --fixture fixtures/continuous/unrelated-change.json \
            --mode plan-only \
            --output-dir .dare-agent-security/continuous-ci

  productization-v1:
    name: Cycle 011 productization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Product crate tests
        run: cargo test -p dare-product -- --nocapture
      - name: Product CLI smoke (init/doctor)
        run: |
          TMP=$(mktemp -d)
          cargo run -p dare-agent-security -- init "$TMP" --name ci-product
          cargo run -p dare-agent-security -- doctor "$TMP" --json
          cargo run -p dare-agent-security -- assess "$TMP" --offline --run run-ci-001
          cargo run -p dare-agent-security -- report --path "$TMP" --run run-ci-001
          rm -rf "$TMP"
      - name: Demo fixture assess (secure)
        run: |
          cargo run -p dare-agent-security -- assess examples/secure-mcp --offline --run run-ci-secure

  agentic-registry-2026:
    name: Cycle 012 Agentic registry security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Agentic registry, provenance, hostile fixtures and legacy compatibility
        run: cargo test -p dare-coverage --test agentic_registry -- --nocapture
      - name: Full coverage crate regression
        run: cargo test -p dare-coverage -- --nocapture
      - name: Agentic CLI profile selection and family artifact
        run: |
          rm -rf .dare-agent-security/cycle012-ci
          cargo run -p dare-agent-security -- validate coverage \
            --profile agentic-security-baseline-2026 \
            --facts fixtures/coverage/agentic-all-capabilities.json \
            --output-dir .dare-agent-security/cycle012-ci
          test -f .dare-agent-security/cycle012-ci/coverage-report.json
          test -f .dare-agent-security/cycle012-ci/risk-family-coverage.json
          grep -q 'UNASSESSED' .dare-agent-security/cycle012-ci/risk-family-coverage.json
          if grep -q '"assessment_state": "SECURE"' .dare-agent-security/cycle012-ci/risk-family-coverage.json; then exit 1; fi
      - name: Legacy MCP CLI compatibility
        run: |
          rm -rf .dare-agent-security/cycle012-mcp-ci
          cargo run -p dare-agent-security -- validate coverage \
            --profile mcp-security-baseline \
            --facts fixtures/coverage/fixture-a-tools-static-roe.json \
            --output-dir .dare-agent-security/cycle012-mcp-ci
          test -f .dare-agent-security/cycle012-mcp-ci/coverage-report.json
          test ! -f .dare-agent-security/cycle012-mcp-ci/risk-family-coverage.json
      - name: Confidential offline Agentic product regression
        run: cargo test -p dare-product --test agentic_offline -- --nocapture

  prompt-injection-2026:
    name: Cycle 013 Prompt Injection security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Engine unit tests (schemas, enums, invariants, trials, adapters)
        run: cargo test -p dare-prompt-injection --lib -- --nocapture
      - name: Corpus, schemas and direct secure/vulnerable pairs
        run: cargo test -p dare-prompt-injection --test corpus_direct -- --nocapture
      - name: Indirect secure/vulnerable pairs and source boundaries
        run: cargo test -p dare-prompt-injection --test corpus_indirect -- --nocapture
      - name: Benign controls and false-positive regressions
        run: cargo test -p dare-prompt-injection --test benign_controls -- --nocapture
      - name: Hostile parser fixtures, executable-field and enum refusal
        run: cargo test -p dare-prompt-injection --test hostile_fixtures -- --nocapture
      - name: Canary, protected-field and unauthorized-action detectors
        run: cargo test -p dare-prompt-injection --test deterministic_checks -- --nocapture
      - name: Offline, confidential and no-remote-target regressions
        run: cargo test -p dare-prompt-injection --test offline_confidential -- --nocapture
      - name: Prompt-injection profile and coverage integration
        run: cargo test -p dare-coverage --test prompt_injection_profile -- --nocapture
      - name: Additive product metadata and bounded-claim wording
        run: cargo test -p dare-product prompt_injection -- --nocapture
      - name: CLI flag surface (no remote, provider or credential flag)
        run: cargo test -p dare-agent-security --lib prompt_injection -- --nocapture

      - name: Offline CLI - direct secure pair
        run: |
          rm -rf .dare-agent-security/cycle013-direct
          cargo run -p dare-agent-security -- validate prompt-injection \
            --scenario PI-LAB-001 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle013-direct
          test -f .dare-agent-security/cycle013-direct/prompt-injection-result.json
          test -f .dare-agent-security/cycle013-direct/prompt-injection-trials.json
          test -f .dare-agent-security/cycle013-direct/prompt-injection-evidence.json
          test -f .dare-agent-security/cycle013-direct/summary.md
          grep -q '"verdict": "PASS"' .dare-agent-security/cycle013-direct/prompt-injection-result.json

      - name: Offline CLI - direct vulnerable pair exits non-zero
        run: |
          rm -rf .dare-agent-security/cycle013-vuln
          set +e
          cargo run -p dare-agent-security -- validate prompt-injection \
            --scenario PI-LAB-002 \
            --mode local-synthetic \
            --output-dir .dare-agent-security/cycle013-vuln
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for an observed violation, got $code"
            exit 1
          fi
          grep -q '"verdict": "FAIL"' .dare-agent-security/cycle013-vuln/prompt-injection-result.json

      - name: Offline CLI - indirect vulnerable pair
        run: |
          rm -rf .dare-agent-security/cycle013-indirect
          set +e
          cargo run -p dare-agent-security -- validate prompt-injection \
            --scenario PI-LAB-008 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle013-indirect
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for an observed violation, got $code"
            exit 1
          fi
          grep -q '| INDIRECT | TESTED |' .dare-agent-security/cycle013-indirect/summary.md

      - name: Offline CLI - ambiguous prose is INCONCLUSIVE, never FAIL
        run: |
          rm -rf .dare-agent-security/cycle013-inconclusive
          set +e
          cargo run -p dare-agent-security -- validate prompt-injection \
            --scenario PI-LAB-010 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle013-inconclusive
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for an inconclusive run, got $code"
            exit 1
          fi
          grep -q '"verdict": "INCONCLUSIVE"' .dare-agent-security/cycle013-inconclusive/prompt-injection-result.json
          if grep -q '"verdict": "FAIL"' .dare-agent-security/cycle013-inconclusive/prompt-injection-result.json; then
            echo "ambiguous prose must never produce FAIL"
            exit 1
          fi

      - name: Offline CLI - replay mode reads only a local transcript
        run: |
          rm -rf .dare-agent-security/cycle013-replay
          cargo run -p dare-agent-security -- validate prompt-injection \
            --scenario PI-LAB-001 \
            --mode replay \
            --transcript fixtures/prompt-injection/transcripts/PI-LAB-001-secure.json \
            --output-dir .dare-agent-security/cycle013-replay
          grep -q '"mode": "REPLAY"' .dare-agent-security/cycle013-replay/prompt-injection-result.json

      - name: Trial hard maximum is enforced
        run: |
          set +e
          cargo run -p dare-agent-security -- validate prompt-injection \
            --scenario PI-LAB-001 --trials 11 --output-dir .dare-agent-security/cycle013-bounds
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "--trials 11 must be refused"
            exit 1
          fi

      - name: Stop-on-first-fail and output budget exhaustion
        run: |
          rm -rf .dare-agent-security/cycle013-stop .dare-agent-security/cycle013-budget
          set +e
          cargo run -p dare-agent-security -- validate prompt-injection \
            --scenario PI-LAB-013 --mode simulated \
            --output-dir .dare-agent-security/cycle013-stop
          cargo run -p dare-agent-security -- validate prompt-injection \
            --scenario PI-LAB-014 --mode simulated \
            --output-dir .dare-agent-security/cycle013-budget
          set -e
          grep -q '"reason": "FIRST_FAIL"' .dare-agent-security/cycle013-stop/prompt-injection-result.json
          grep -q '"reason": "BUDGET_EXHAUSTED"' .dare-agent-security/cycle013-budget/prompt-injection-result.json

      - name: Canary redaction and evidence hygiene
        run: |
          rm -rf .dare-agent-security/cycle013-canary
          set +e
          cargo run -p dare-agent-security -- validate prompt-injection \
            --scenario PI-LAB-015 --mode simulated \
            --output-dir .dare-agent-security/cycle013-canary
          set -e
          for f in .dare-agent-security/cycle013-canary/*; do
            if grep -q 'DARE-SYNTHETIC-CANARY-ALPHA1' "$f"; then
              echo "artifact $f leaked the canary token"
              exit 1
            fi
          done

      - name: Remote target and credential flags are absent
        run: |
          set +e
          cargo run -p dare-agent-security -- validate prompt-injection \
            --scenario PI-LAB-001 --url https://example.invalid --output-dir out
          url_code=$?
          cargo run -p dare-agent-security -- validate prompt-injection \
            --scenario PI-LAB-001 --api-key placeholder --output-dir out
          key_code=$?
          set -e
          if [ "$url_code" -eq 0 ]; then
            echo "--url must not be accepted"
            exit 1
          fi
          if [ "$key_code" -eq 0 ]; then
            echo "--api-key must not be accepted"
            exit 1
          fi

      - name: Report wording carries no universal security claim
        run: |
          for f in .dare-agent-security/cycle013-*/summary.md; do
            if grep -qiE 'prompt injection secure|immune|fully protected|guaranteed secure|cannot be injected' "$f"; then
              echo "summary $f contains an unbounded security claim"
              exit 1
            fi
          done

      - name: Agentic baseline regression (Cycle 012)
        run: |
          cargo test -p dare-coverage --test agentic_registry -- --nocapture
          cargo test -p dare-coverage --test prompt_injection_properties -- --nocapture
          rm -rf .dare-agent-security/cycle013-agentic
          cargo run -p dare-agent-security -- validate coverage \
            --profile agentic-security-baseline-2026 \
            --facts fixtures/coverage/agentic-all-capabilities.json \
            --output-dir .dare-agent-security/cycle013-agentic
          test -f .dare-agent-security/cycle013-agentic/coverage-report.json
          if grep -q '"assessment_state": "SECURE"' .dare-agent-security/cycle013-agentic/risk-family-coverage.json; then
            echo "no untested family may render as SECURE"
            exit 1
          fi

      - name: MCP baseline regression
        run: |
          rm -rf .dare-agent-security/cycle013-mcp
          cargo run -p dare-agent-security -- validate coverage \
            --profile mcp-security-baseline \
            --facts fixtures/coverage/fixture-a-tools-static-roe.json \
            --output-dir .dare-agent-security/cycle013-mcp
          test -f .dare-agent-security/cycle013-mcp/coverage-report.json
          test ! -f .dare-agent-security/cycle013-mcp/risk-family-coverage.json

  tool-security-2026:
    name: Cycle 014 Tool Poisoning and Tool Misuse security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Engine unit tests (schemas, enums, invariants, bounds, adapters)
        run: cargo test -p dare-tool-security --lib -- --nocapture
      - name: Corpus, paired vectors, benign controls and false-positive regressions
        run: cargo test -p dare-tool-security --test corpus_integration -- --nocapture
      - name: Hostile parser fixtures fail closed
        run: cargo test -p dare-tool-security --test hostile_fixtures -- --nocapture
      - name: Offline, confidential and no-remote-tool regressions
        run: cargo test -p dare-tool-security --test offline_confidential -- --nocapture
      - name: Tool-security profile and coverage integration
        run: cargo test -p dare-coverage --test tool_security_profile -- --nocapture
      - name: Tool-security properties and standards provenance
        run: |
          cargo test -p dare-coverage --test tool_security_properties -- --nocapture
          cargo test -p dare-coverage --lib tool_security_standards -- --nocapture
      - name: Additive product metadata and bounded-claim wording
        run: cargo test -p dare-product --lib tool_security_metadata -- --nocapture
      - name: CLI flag surface (no remote, provider, credential or live-MCP flag)
        run: cargo test -p dare-agent-security --lib tool_security -- --nocapture
      - name: CLI end-to-end matrix and product reporting bridge
        run: |
          cargo test -p dare-agent-security --test tool_security_cli -- --nocapture
          cargo test -p dare-agent-security --test tool_security_product -- --nocapture

      - name: Corpus and fixtures are generated, not hand-edited
        run: |
          python scripts/gen-tool-security-corpus.py --check
          python scripts/gen-tool-security-hostile-fixtures.py --check
          python scripts/gen-tool-security-scenarios.py --check

      - name: Offline CLI - benign control passes
        run: |
          rm -rf .dare-agent-security/cycle014-benign
          cargo run -p dare-agent-security -- validate tool-security \
            --scenario TOOL-LAB-001 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle014-benign
          test -f .dare-agent-security/cycle014-benign/tool-security-result.json
          test -f .dare-agent-security/cycle014-benign/tool-security-trials.json
          test -f .dare-agent-security/cycle014-benign/tool-security-evidence.json
          test -f .dare-agent-security/cycle014-benign/summary.md
          python scripts/assert-json.py \
            .dare-agent-security/cycle014-benign/tool-security-result.json \
            verdict=PASS class=POISONING mode=SIMULATED synthetic=true \
            trials_planned=3 trials_executed=3 \
            stop_reason.reason=PLAN_COMPLETED redaction_state=REDACTED \
            budget.state_changes=0 budget.external_egress_bytes=0 \
            --present scenario_digest objective_digest policy_digest surface_digest tool_digests

      - name: Offline CLI - tool poisoning vector fails deterministically
        run: |
          rm -rf .dare-agent-security/cycle014-poisoning
          set +e
          cargo run -p dare-agent-security -- validate tool-security \
            --scenario TOOL-LAB-002 \
            --mode local-synthetic \
            --output-dir .dare-agent-security/cycle014-poisoning
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for an observed violation, got $code"
            exit 1
          fi
          python scripts/assert-json.py \
            .dare-agent-security/cycle014-poisoning/tool-security-result.json \
            verdict=FAIL class=POISONING mode=LOCAL_SYNTHETIC \
            invariant=TOOL_METADATA_NOT_AUTHORITATIVE \
            stop_reason.reason=FIRST_FAIL trials_executed=1 \
            budget.state_changes=0 budget.external_egress_bytes=0

      - name: Offline CLI - tool misuse vector fails deterministically
        run: |
          rm -rf .dare-agent-security/cycle014-misuse
          set +e
          cargo run -p dare-agent-security -- validate tool-security \
            --scenario TOOL-LAB-008 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle014-misuse
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for an observed violation, got $code"
            exit 1
          fi
          python scripts/assert-json.py \
            .dare-agent-security/cycle014-misuse/tool-security-result.json \
            verdict=FAIL class=MISUSE invariant=APPROVED_TOOL_ONLY trials.0.verdict=FAIL

      - name: A risky operation is observed and never dispatched
        run: |
          rm -rf .dare-agent-security/cycle014-dangerous
          set +e
          cargo run -p dare-agent-security -- validate tool-security \
            --scenario TOOL-LAB-010 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle014-dangerous
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for a dangerous-operation request, got $code"
            exit 1
          fi
          python scripts/assert-json.py \
            .dare-agent-security/cycle014-dangerous/tool-security-result.json \
            verdict=FAIL invariant=DANGEROUS_ARGUMENT_NOT_REQUESTED \
            budget.state_changes=0 budget.external_egress_bytes=0 \
            --all "trials.*.events.*.dispatched=false" --min-matches 1

      - name: Absence of evidence is INCONCLUSIVE, never PASS and never FAIL
        run: |
          rm -rf .dare-agent-security/cycle014-inconclusive
          set +e
          cargo run -p dare-agent-security -- validate tool-security \
            --scenario TOOL-LAB-015 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle014-inconclusive
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for an inconclusive run, got $code"
            exit 1
          fi
          python scripts/assert-json.py \
            .dare-agent-security/cycle014-inconclusive/tool-security-result.json \
            verdict=INCONCLUSIVE \
            --all "trials.*.verdict=INCONCLUSIVE" --min-matches 1
          python scripts/assert-json.py \
            .dare-agent-security/cycle014-inconclusive/tool-security-result.json \
            --all "trials.*.coverage_satisfied=false" --min-matches 1

      - name: Independent violations are all recorded, never masked
        run: |
          rm -rf .dare-agent-security/cycle014-multi
          set +e
          cargo run -p dare-agent-security -- validate tool-security \
            --scenario TOOL-LAB-019 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle014-multi
          set -e
          python scripts/assert-json.py \
            .dare-agent-security/cycle014-multi/tool-security-result.json \
            verdict=FAIL --min-total "trials.*.violations=1"
          # TOOL-LAB-008 is where multiplicity is visible in one artifact: the
          # same unapproved tool crosses APPROVED_TOOL_ONLY twice, once when
          # selected and once when requested. A first-match evaluator would
          # report one of those and silently lose the other. TOOL-LAB-019's
          # independence spans several invariants, which one CLI run cannot
          # show, so the corpus suite covers that case instead.
          python scripts/assert-json.py \
            .dare-agent-security/cycle014-misuse/tool-security-result.json \
            verdict=FAIL --min-total "trials.*.violations=2"

      - name: Offline CLI - replay reads only a local trace
        run: |
          rm -rf .dare-agent-security/cycle014-replay
          cargo run -p dare-agent-security -- validate tool-security \
            --scenario TOOL-LAB-005 \
            --mode replay \
            --trace fixtures/tool-security/traces/TOOL-LAB-005.json \
            --output-dir .dare-agent-security/cycle014-replay
          python scripts/assert-json.py \
            .dare-agent-security/cycle014-replay/tool-security-result.json \
            verdict=PASS mode=REPLAY synthetic=false

      - name: A poisoned or substituted corpus is refused before execution
        run: |
          set +e
          cargo run -p dare-agent-security -- validate tool-security \
            --scenario TOOL-LAB-017 \
            --corpus fixtures/tool-security/lab-corpora/executable-field-corpus \
            --output-dir .dare-agent-security/cycle014-executable
          executable_code=$?
          cargo run -p dare-agent-security -- validate tool-security \
            --scenario TOOL-LAB-016 \
            --corpus fixtures/tool-security/lab-corpora/malformed-corpus \
            --output-dir .dare-agent-security/cycle014-substituted
          substituted_code=$?
          set -e
          if [ "$executable_code" -ne 3 ]; then
            echo "an executable field in a corpus vector must exit 3, got $executable_code"
            exit 1
          fi
          if [ "$substituted_code" -ne 3 ]; then
            echo "a substituted corpus digest must exit 3, got $substituted_code"
            exit 1
          fi
          if [ -e .dare-agent-security/cycle014-executable ]; then
            echo "a refused run must write no artifact"
            exit 1
          fi
          if [ -e .dare-agent-security/cycle014-substituted ]; then
            echo "a refused run must write no artifact"
            exit 1
          fi

      - name: Trial hard maximum is enforced and never clamped upward
        run: |
          rm -rf .dare-agent-security/cycle014-bounds .dare-agent-security/cycle014-bounds-ok
          set +e
          cargo run -p dare-agent-security -- validate tool-security \
            --scenario TOOL-LAB-001 --trials 11 \
            --output-dir .dare-agent-security/cycle014-bounds
          over_code=$?
          set -e
          if [ "$over_code" -eq 0 ]; then
            echo "--trials 11 must be refused"
            exit 1
          fi
          if [ -e .dare-agent-security/cycle014-bounds ]; then
            echo "a refused run must write no artifact"
            exit 1
          fi
          cargo run -p dare-agent-security -- validate tool-security \
            --scenario TOOL-LAB-001 --trials 10 \
            --output-dir .dare-agent-security/cycle014-bounds-ok
          python scripts/assert-json.py \
            .dare-agent-security/cycle014-bounds-ok/tool-security-result.json \
            trials_planned=10 \
            budget.max_total_tool_requests=12 \
            budget.chain_depth_bound=2

      - name: Remote, credential and live-MCP flags do not exist
        run: |
          set +e
          for flag in --url --endpoint --api-key --token --provider --remote --command --mcp-server; do
            cargo run -p dare-agent-security -- validate tool-security \
              --scenario TOOL-LAB-001 "$flag" placeholder \
              --output-dir .dare-agent-security/cycle014-flag >/dev/null 2>&1
            flag_code=$?
            if [ "$flag_code" -eq 0 ]; then
              set -e
              echo "$flag must not be accepted by this capability"
              exit 1
            fi
          done
          set -e
          echo "no remote, credential or live-MCP flag is accepted"

      - name: Report wording carries no universal tool-security claim
        run: |
          python scripts/assert-text.py \
            --glob '.dare-agent-security/cycle014-*/summary.md' \
            --min-files 8 \
            --contains 'no result here should be read as a claim of universal tool security' \
            --forbidden 'tool secure' 'tools are secure' 'safe tools' 'immune' \
                        'fully protected' 'guaranteed secure' 'cannot be poisoned' \
                        'cannot be misused'

      - name: The approved bounded wording is used verbatim on a pass
        run: |
          python scripts/assert-text.py \
            .dare-agent-security/cycle014-benign/summary.md \
            --contains 'No tool-security invariant violation was observed for the tested vectors under the recorded conditions'

      - name: Summaries separate poisoning from misuse and name untested surfaces
        run: |
          python scripts/assert-text.py \
            .dare-agent-security/cycle014-benign/summary.md \
            --row '| TOOL_POISONING | TESTED |' \
                  '| TOOL_MISUSE | NOT TESTED |' \
                  '| Poisoning: description | TESTED |' \
                  '| Poisoning: output | NOT TESTED |' \
                  '| Misuse: selection | NOT APPLICABLE |' \
                  '| State changes | 0 |' \
                  '| External egress bytes | 0 |'
          python scripts/assert-text.py \
            .dare-agent-security/cycle014-misuse/summary.md \
            --row '| TOOL_POISONING | NOT TESTED |' \
                  '| TOOL_MISUSE | TESTED |' \
                  '| Misuse: selection | TESTED |' \
                  '| Poisoning: description | NOT APPLICABLE |'

      - name: No artifact leaks a canary or credential
        run: |
          rm -rf .dare-agent-security/cycle014-canary
          cargo run -p dare-agent-security -- validate tool-security \
            --scenario TOOL-LAB-018 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle014-canary
          python scripts/assert-text.py \
            --glob '.dare-agent-security/cycle014-*/*' \
            --min-files 20 \
            --secret-markers
          python scripts/assert-text.py \
            .dare-agent-security/cycle014-canary/tool-security-result.json \
            --contains '[REDACTED]'

      - name: Prompt Injection regression (Cycle 013)
        run: |
          cargo test -p dare-prompt-injection -- --nocapture
          cargo test -p dare-coverage --test prompt_injection_profile -- --nocapture
          rm -rf .dare-agent-security/regression-prompt-injection
          cargo run -p dare-agent-security -- validate prompt-injection \
            --scenario PI-LAB-001 \
            --mode simulated \
            --output-dir .dare-agent-security/regression-prompt-injection
          python scripts/assert-json.py \
            .dare-agent-security/regression-prompt-injection/prompt-injection-result.json \
            verdict=PASS mode=SIMULATED

      - name: Agentic baseline regression (Cycle 012)
        run: |
          cargo test -p dare-coverage --test agentic_registry -- --nocapture
          cargo test -p dare-coverage --test prompt_injection_properties -- --nocapture
          rm -rf .dare-agent-security/regression-agentic
          cargo run -p dare-agent-security -- validate coverage \
            --profile agentic-security-baseline-2026 \
            --facts fixtures/coverage/agentic-all-capabilities.json \
            --output-dir .dare-agent-security/regression-agentic
          test -f .dare-agent-security/regression-agentic/coverage-report.json
          python scripts/assert-json.py \
            .dare-agent-security/regression-agentic/risk-family-coverage.json \
            --count "=10" \
            --all "*.properties=1" --min-matches 10

      - name: No untested risk family renders as SECURE
        run: |
          python scripts/assert-risk-family-state.py \
            .dare-agent-security/regression-agentic/risk-family-coverage.json

      - name: MCP baseline regression
        run: |
          rm -rf .dare-agent-security/regression-mcp
          cargo run -p dare-agent-security -- validate coverage \
            --profile mcp-security-baseline \
            --facts fixtures/coverage/fixture-a-tools-static-roe.json \
            --output-dir .dare-agent-security/regression-mcp
          test -f .dare-agent-security/regression-mcp/coverage-report.json
          test ! -f .dare-agent-security/regression-mcp/risk-family-coverage.json

  identity-security-2026:
    name: Cycle 015 Identity, Privilege and Delegation security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Engine unit tests (schemas, enums, invariants, bounds, adapters)
        run: cargo test -p dare-identity-security --lib -- --nocapture
      - name: Deterministic invariant evaluation across PASS, FAIL and INCONCLUSIVE
        run: cargo test -p dare-identity-security --test deterministic_invariants -- --nocapture
      - name: The 24 IDENTITY-LAB fixtures end to end
        run: cargo test -p dare-identity-security --test lab_scenarios -- --nocapture
      - name: Corpus, paired vectors and benign controls
        run: cargo test -p dare-identity-security --test corpus_integration -- --nocapture
      - name: Hostile parser fixtures fail closed
        run: cargo test -p dare-identity-security --test hostile_fixtures -- --nocapture
      - name: Independent multi-violation capture and redaction hygiene
        run: cargo test -p dare-identity-security --test violations_and_hygiene -- --nocapture
      - name: Identity-security profile and coverage integration
        run: cargo test -p dare-coverage --test identity_security_profile -- --nocapture
      - name: Identity-security properties and standards provenance
        run: |
          cargo test -p dare-coverage --test identity_security_properties -- --nocapture
          cargo test -p dare-coverage --lib identity_security_standards -- --nocapture
      - name: Additive product metadata and bounded-claim wording
        run: cargo test -p dare-product --lib identity_security_metadata -- --nocapture
      - name: CLI flag surface (no provider, credential, PDP or live-identity flag)
        run: cargo test -p dare-agent-security --lib identity_security -- --nocapture
      - name: CLI end-to-end matrix and product reporting bridge
        run: |
          cargo test -p dare-agent-security --test identity_security_cli -- --nocapture
          cargo test -p dare-agent-security --test identity_security_product -- --nocapture

      - name: Corpus, scenarios and hostile fixtures are generated, not hand-edited
        run: |
          python scripts/gen-identity-security-corpus.py --check
          python scripts/gen-identity-security-scenarios.py --check
          python scripts/gen-identity-security-hostile-fixtures.py --check

      - name: Offline CLI - the initiating principal is preserved
        run: |
          rm -rf .dare-agent-security/cycle015-benign
          cargo run -p dare-agent-security -- validate identity-security \
            --scenario IDENTITY-LAB-001 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle015-benign
          test -f .dare-agent-security/cycle015-benign/identity-security-result.json
          test -f .dare-agent-security/cycle015-benign/identity-security-trials.json
          test -f .dare-agent-security/cycle015-benign/identity-security-evidence.json
          test -f .dare-agent-security/cycle015-benign/summary.md
          python scripts/assert-json.py \
            .dare-agent-security/cycle015-benign/identity-security-result.json \
            verdict=PASS class=PRINCIPAL_BINDING mode=SIMULATED synthetic=true \
            invariant=INITIATING_PRINCIPAL_PRESERVED \
            trials_planned=3 trials_executed=3 \
            stop_reason.reason=PLAN_COMPLETED redaction_state=REDACTED \
            budget.state_changes=0 budget.external_egress_bytes=0 \
            initiating_principal_id=user-7 effective_principal_id=user-7 \
            --present scenario_digest principal_set_digest authority_digests \
                      delegation_chain_digest resource_context_digest policy_digest

      - name: Offline CLI - agent authority substituted for the user fails
        run: |
          rm -rf .dare-agent-security/cycle015-substitution
          set +e
          cargo run -p dare-agent-security -- validate identity-security \
            --scenario IDENTITY-LAB-002 \
            --mode local-synthetic \
            --output-dir .dare-agent-security/cycle015-substitution
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for an observed violation, got $code"
            exit 1
          fi
          python scripts/assert-json.py \
            .dare-agent-security/cycle015-substitution/identity-security-result.json \
            verdict=FAIL class=PRINCIPAL_BINDING mode=LOCAL_SYNTHETIC \
            invariant=AGENT_AUTHORITY_NOT_SUBSTITUTED_FOR_USER \
            stop_reason.reason=FIRST_FAIL trials_executed=1 \
            budget.state_changes=0 budget.external_egress_bytes=0

      - name: Offline CLI - delegated scope excess fails
        run: |
          rm -rf .dare-agent-security/cycle015-scope
          set +e
          cargo run -p dare-agent-security -- validate identity-security \
            --scenario IDENTITY-LAB-004 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle015-scope
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for an observed violation, got $code"
            exit 1
          fi
          python scripts/assert-json.py \
            .dare-agent-security/cycle015-scope/identity-security-result.json \
            verdict=FAIL class=DELEGATION invariant=DELEGATION_SCOPE_NOT_EXCEEDED \
            trials.0.verdict=FAIL

      - name: A cross-tenant intent is proven from declarations, never by access
        run: |
          rm -rf .dare-agent-security/cycle015-tenant
          set +e
          cargo run -p dare-agent-security -- validate identity-security \
            --scenario IDENTITY-LAB-008 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle015-tenant
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for a cross-tenant intent, got $code"
            exit 1
          fi
          python scripts/assert-json.py \
            .dare-agent-security/cycle015-tenant/identity-security-result.json \
            verdict=FAIL class=TENANT_RESOURCE invariant=TENANT_BOUNDARY_PRESERVED \
            budget.state_changes=0 budget.external_egress_bytes=0 \
            --all "trials.*.events.*.dispatched=false" --min-matches 1

      - name: Credential availability is not delegated authority
        run: |
          rm -rf .dare-agent-security/cycle015-credential
          set +e
          cargo run -p dare-agent-security -- validate identity-security \
            --scenario IDENTITY-LAB-006 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle015-credential
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for credential-driven expansion, got $code"
            exit 1
          fi
          python scripts/assert-json.py \
            .dare-agent-security/cycle015-credential/identity-security-result.json \
            verdict=FAIL class=PRIVILEGE \
            invariant=CREDENTIAL_CONTEXT_NOT_EXPAND_AUTHORITY

      - name: A permit does not survive an authorization-relevant mutation
        run: |
          rm -rf .dare-agent-security/cycle015-binding
          set +e
          cargo run -p dare-agent-security -- validate identity-security \
            --scenario IDENTITY-LAB-012 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle015-binding
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for a post-permit mutation, got $code"
            exit 1
          fi
          python scripts/assert-json.py \
            .dare-agent-security/cycle015-binding/identity-security-result.json \
            verdict=FAIL class=AUTHORIZATION_BINDING \
            invariant=AUTHORIZATION_BOUND_TO_FINAL_OPERATION

      - name: A denied operation is reported and never dispatched
        run: |
          rm -rf .dare-agent-security/cycle015-deny
          set +e
          cargo run -p dare-agent-security -- validate identity-security \
            --scenario IDENTITY-LAB-015 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle015-deny
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for a deny bypass, got $code"
            exit 1
          fi
          python scripts/assert-json.py \
            .dare-agent-security/cycle015-deny/identity-security-result.json \
            verdict=FAIL invariant=DENY_NOT_BYPASSED \
            budget.state_changes=0 budget.external_egress_bytes=0 \
            --all "trials.*.events.*.dispatched=false" --min-matches 1

      - name: Absence of evidence is INCONCLUSIVE, never PASS and never FAIL
        run: |
          rm -rf .dare-agent-security/cycle015-inconclusive
          set +e
          cargo run -p dare-agent-security -- validate identity-security \
            --scenario IDENTITY-LAB-016 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle015-inconclusive
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for an inconclusive run, got $code"
            exit 1
          fi
          python scripts/assert-json.py \
            .dare-agent-security/cycle015-inconclusive/identity-security-result.json \
            verdict=INCONCLUSIVE \
            --all "trials.*.verdict=INCONCLUSIVE" --min-matches 1
          python scripts/assert-json.py \
            .dare-agent-security/cycle015-inconclusive/identity-security-result.json \
            --all "trials.*.coverage_satisfied=false" --min-matches 1

      - name: Independent violations are all recorded, never masked
        run: |
          rm -rf .dare-agent-security/cycle015-multi
          set +e
          cargo run -p dare-agent-security -- validate identity-security \
            --scenario IDENTITY-LAB-020 \
            --mode simulated \
            --output-dir .dare-agent-security/cycle015-multi
          set -e
          python scripts/assert-json.py \
            .dare-agent-security/cycle015-multi/identity-security-result.json \
            verdict=FAIL --min-total "trials.*.violations=1"
          # One CLI run evaluates the scenario's declared invariant, so a single
          # artifact cannot show independence across invariants. LAB-020 stages
          # four simultaneous violations and the crate suite
          # (violations_and_hygiene) is where all four are asserted together.

      - name: Replay reads only a local trace and stays offline
        run: |
          rm -rf .dare-agent-security/cycle015-replay
          cargo run -p dare-agent-security -- validate identity-security \
            --scenario IDENTITY-LAB-001 \
            --mode replay \
            --trace fixtures/identity-security/traces/IDENTITY-LAB-001.json \
            --output-dir .dare-agent-security/cycle015-replay
          python scripts/assert-json.py \
            .dare-agent-security/cycle015-replay/identity-security-result.json \
            mode=REPLAY synthetic=false

      - name: An unresolvable or over-bound scenario is refused before evaluation
        run: |
          set +e
          cargo run -p dare-agent-security -- validate identity-security \
            --scenario IDENTITY-LAB-018 \
            --output-dir .dare-agent-security/cycle015-unknown-principal
          unknown_code=$?
          cargo run -p dare-agent-security -- validate identity-security \
            --scenario IDENTITY-LAB-021 \
            --output-dir .dare-agent-security/cycle015-deep-chain
          depth_code=$?
          cargo run -p dare-agent-security -- validate identity-security \
            --scenario IDENTITY-LAB-024 \
            --output-dir .dare-agent-security/cycle015-executable
          executable_code=$?
          set -e
          for pair in "unknown principal:$unknown_code" "delegation depth:$depth_code" "executable field:$executable_code"; do
            label="${pair%%:*}"
            code="${pair##*:}"
            if [ "$code" -ne 3 ]; then
              echo "a refused scenario ($label) must exit 3, got $code"
              exit 1
            fi
          done
          for dir in cycle015-unknown-principal cycle015-deep-chain cycle015-executable; do
            if [ -e ".dare-agent-security/$dir" ]; then
              echo "a refused run must write no artifact ($dir)"
              exit 1
            fi
          done

      - name: Trial hard maximum is enforced and never clamped upward
        run: |
          rm -rf .dare-agent-security/cycle015-bounds .dare-agent-security/cycle015-bounds-ok
          set +e
          cargo run -p dare-agent-security -- validate identity-security \
            --scenario IDENTITY-LAB-001 --trials 11 \
            --output-dir .dare-agent-security/cycle015-bounds
          over_code=$?
          set -e
          if [ "$over_code" -eq 0 ]; then
            echo "--trials 11 must be refused"
            exit 1
          fi
          if [ -e .dare-agent-security/cycle015-bounds ]; then
            echo "a refused run must write no artifact"
            exit 1
          fi
          cargo run -p dare-agent-security -- validate identity-security \
            --scenario IDENTITY-LAB-001 --trials 10 \
            --output-dir .dare-agent-security/cycle015-bounds-ok
          python scripts/assert-json.py \
            .dare-agent-security/cycle015-bounds-ok/identity-security-result.json \
            trials_planned=10 \
            budget.max_total_operations=24 \
            budget.delegation_depth_bound=2 \
            budget.state_changes=0 budget.external_egress_bytes=0

      - name: Provider, credential, PDP and live-identity flags do not exist
        run: |
          set +e
          for flag in --url --endpoint --issuer --jwks --token --bearer \
                      --client-secret --api-key --pdp-url --authzen-url \
                      --remote --command; do
            cargo run -p dare-agent-security -- validate identity-security \
              --scenario IDENTITY-LAB-001 "$flag" placeholder \
              --output-dir .dare-agent-security/cycle015-flag >/dev/null 2>&1
            flag_code=$?
            if [ "$flag_code" -eq 0 ]; then
              set -e
              echo "$flag must not be accepted by this capability"
              exit 1
            fi
          done
          set -e
          echo "no provider, credential, PDP or live-identity flag is accepted"

      - name: No live identity mode can be selected
        run: |
          set +e
          for mode in live live-idp oauth oidc remote production pdp authzen; do
            cargo run -p dare-agent-security -- validate identity-security \
              --scenario IDENTITY-LAB-001 --mode "$mode" \
              --output-dir .dare-agent-security/cycle015-mode >/dev/null 2>&1
            mode_code=$?
            if [ "$mode_code" -eq 0 ]; then
              set -e
              echo "--mode $mode must not be accepted"
              exit 1
            fi
          done
          set -e
          echo "only replay, simulated and local-synthetic are selectable"

      - name: Report wording carries no universal identity-security claim
        run: |
          python scripts/assert-text.py \
            --glob '.dare-agent-security/cycle015-*/summary.md' \
            --min-files 10 \
            --contains 'no result here should be read as a claim of universal identity or authorization security' \
            --forbidden 'Identity Secure' 'Authorization Secure' \
                        'No Privilege Escalation Possible' 'Fully Protected' 'Immune' \
                        'guaranteed secure' 'cannot be escalated' 'cannot be impersonated' \
                        'AuthZEN compliant' 'COAZ compliant'

      - name: The approved bounded wording is used verbatim on a pass
        run: |
          python scripts/assert-text.py \
            .dare-agent-security/cycle015-benign/summary.md \
            --contains 'No identity-security invariant violation was observed for the tested vectors under the recorded conditions'

      - name: Summaries report each surface separately and name untested ones
        run: |
          python scripts/assert-text.py \
            .dare-agent-security/cycle015-benign/summary.md \
            --row '| PRINCIPAL_BINDING | TESTED |' \
                  '| DELEGATION | NOT TESTED |' \
                  '| PRIVILEGE | NOT TESTED |' \
                  '| TENANT_RESOURCE | NOT TESTED |' \
                  '| AUTHORIZATION_BINDING | NOT TESTED |' \
                  '| Synthetic observations | yes |' \
                  '| State changes | 0 |' \
                  '| External egress bytes | 0 |'
          python scripts/assert-text.py \
            .dare-agent-security/cycle015-tenant/summary.md \
            --row '| TENANT_RESOURCE | TESTED |' \
                  '| PRINCIPAL_BINDING | NOT TESTED |'
          python scripts/assert-text.py \
            .dare-agent-security/cycle015-replay/summary.md \
            --row '| Mode | REPLAY |' \
                  '| Synthetic observations | no |'

      - name: No artifact leaks a canary, credential or provider
        run: |
          python scripts/assert-text.py \
            --glob '.dare-agent-security/cycle015-*/*' \
            --min-files 40 \
            --secret-markers
          python scripts/assert-text.py \
            --glob '.dare-agent-security/cycle015-*/*.json' \
            --min-files 30 \
            --forbidden 'https://idp' 'https://pdp' 'jwks_uri' 'client_secret' \
                        'access_token' 'refresh_token'

      - name: Authorization-integrity regression (Cycle 003)
        run: |
          cargo test -p dare-coaz-integrity -- --nocapture
          rm -rf .dare-agent-security/regression-coaz
          cargo run -p dare-agent-security -- validate coaz-integrity \
            --all --output-dir .dare-agent-security/regression-coaz
          test -f .dare-agent-security/regression-coaz/ci-result.json

      - name: Tool Security regression (Cycle 014)
        run: |
          cargo test -p dare-tool-security -- --nocapture
          cargo test -p dare-coverage --test tool_security_profile -- --nocapture
          rm -rf .dare-agent-security/regression-tool-security
          cargo run -p dare-agent-security -- validate tool-security \
            --scenario TOOL-LAB-001 \
            --mode simulated \
            --output-dir .dare-agent-security/regression-tool-security
          python scripts/assert-json.py \
            .dare-agent-security/regression-tool-security/tool-security-result.json \
            verdict=PASS mode=SIMULATED

      - name: Prompt Injection regression (Cycle 013)
        run: |
          cargo test -p dare-prompt-injection -- --nocapture
          cargo test -p dare-coverage --test prompt_injection_profile -- --nocapture
          rm -rf .dare-agent-security/regression-prompt-injection-015
          cargo run -p dare-agent-security -- validate prompt-injection \
            --scenario PI-LAB-001 \
            --mode simulated \
            --output-dir .dare-agent-security/regression-prompt-injection-015
          python scripts/assert-json.py \
            .dare-agent-security/regression-prompt-injection-015/prompt-injection-result.json \
            verdict=PASS mode=SIMULATED

      - name: Agentic baseline regression (Cycle 012)
        run: |
          cargo test -p dare-coverage --test agentic_registry -- --nocapture
          cargo test -p dare-coverage --test prompt_injection_properties -- --nocapture
          rm -rf .dare-agent-security/regression-agentic-015
          cargo run -p dare-agent-security -- validate coverage \
            --profile agentic-security-baseline-2026 \
            --facts fixtures/coverage/agentic-all-capabilities.json \
            --output-dir .dare-agent-security/regression-agentic-015
          test -f .dare-agent-security/regression-agentic-015/coverage-report.json
          python scripts/assert-json.py \
            .dare-agent-security/regression-agentic-015/risk-family-coverage.json \
            --count "=10" \
            --all "*.properties=1" --min-matches 10

      - name: No untested risk family renders as SECURE
        run: |
          python scripts/assert-risk-family-state.py \
            .dare-agent-security/regression-agentic-015/risk-family-coverage.json

      - name: MCP baseline regression
        run: |
          rm -rf .dare-agent-security/regression-mcp-015
          cargo run -p dare-agent-security -- validate coverage \
            --profile mcp-security-baseline \
            --facts fixtures/coverage/fixture-a-tools-static-roe.json \
            --output-dir .dare-agent-security/regression-mcp-015
          test -f .dare-agent-security/regression-mcp-015/coverage-report.json
          test ! -f .dare-agent-security/regression-mcp-015/risk-family-coverage.json

  docs-build:
    name: mdBook documentation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build English book
        run: mdbook build book/en
      - name: Build Portuguese book
        run: mdbook build book/pt
