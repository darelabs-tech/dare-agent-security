name: DARE Agent Security Gate
description: Deterministic MCP security gate for GitHub Actions (pre-release)
author: DARE Labs

inputs:
  mode:
    description: Bounded operation mode — discover or validate
    required: true
  target:
    description: Explicit target — stdio executable for discover, or COAZ-INTEGRITY fixture id / all for validate
    required: true
  output-dir:
    description: Workspace-relative output directory for evidence and ci-result.json
    required: false
    default: .dare-agent-security
  fail-on-inconclusive:
    description: Fail the step when aggregate verdict is INCONCLUSIVE
    required: false
    default: "true"
  reference-mode:
    description: "validate mode only — secure (default) or vulnerable for synthetic stale-permit proof"
    required: false
    default: secure
  profile:
    description: Optional Cycle 006 assessment profile id or path (enables coverage report)
    required: false
    default: ""
  coverage-facts:
    description: Optional typed facts JSON path for Cycle 006 coverage (required when profile is set)
    required: false
    default: ""
  min-required-coverage:
    description: Fail when required coverage is below this ratio (0.0–1.0). Used only when profile is set.
    required: false
    default: "0"
  fail-on-required-blocked:
    description: Fail when a REQUIRED property is BLOCKED. Used only when profile is set.
    required: false
    default: "false"

outputs:
  verdict:
    description: Aggregate security verdict (PASS, FAIL, INCONCLUSIVE, ERROR)
  evidence-path:
    description: Primary evidence file path relative to workspace
  summary-path:
    description: Job summary markdown path relative to workspace

runs:
  using: docker
  image: Dockerfile
  env:
    INPUT_MODE: ${{ inputs.mode }}
    INPUT_TARGET: ${{ inputs.target }}
    INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
    INPUT_FAIL_ON_INCONCLUSIVE: ${{ inputs.fail-on-inconclusive }}
    INPUT_REFERENCE_MODE: ${{ inputs.reference-mode }}
    INPUT_PROFILE: ${{ inputs.profile }}
    INPUT_COVERAGE_FACTS: ${{ inputs.coverage-facts }}
    INPUT_MIN_REQUIRED_COVERAGE: ${{ inputs.min-required-coverage }}
    INPUT_FAIL_ON_REQUIRED_BLOCKED: ${{ inputs.fail-on-required-blocked }}
