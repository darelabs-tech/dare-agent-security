title: "DARE Agent Security Cycle 005 - Synthetic MCP Security Lab"
version: "1.0.0"
cycle: "005-synthetic-mcp-security-lab"
source_design: "DARE/cycles/005-synthetic-mcp-security-lab/DESIGN.md"
source_blueprint: "DARE/cycles/005-synthetic-mcp-security-lab/BLUEPRINT.md"
source_tasks: "DARE/cycles/005-synthetic-mcp-security-lab/TASKS.md"
limits:
  parent_context_chars: 2000
  task_output_chars: 4000
  timeout_seconds: 1800
rules:
  execution_mode: "execute-only"
  require_design_conformance: true
  require_blueprint_conformance: true
  require_anti_stub_review: true
  fail_closed_on_unknown_schema_major: true
  forbid_customer_specific_fields: true
  forbid_raw_credentials: true
  required_gates:
    - "cargo fmt --all --check"
    - "cargo clippy --workspace --all-targets -- -D warnings"
    - "cargo test --workspace"
tasks:
  - id: task-001
    title: "Reconcile post-Cycle-004 main"
    depends_on: []
    complexity: MED
    spec_file: DARE/cycles/005-synthetic-mcp-security-lab/EXECUTION/task-001.md
    subtask_prompt: |
      Execute Cycle 005 task-001 exactly as defined in DARE/cycles/005-synthetic-mcp-security-lab/EXECUTION/task-001.md.
      Inspect merged Cycle 004 on main: Action/CI contract, CLI, evidence schemas, labs, MCP SDK, CI, docs.
      Produce IMPLEMENTATION-NOTES.md with paths for tasks 002-012. Stop if Cycle 004 acceptance is missing.

  - id: task-002
    title: "Define scenario manifest and schema"
    depends_on: [task-001]
    complexity: HIGH
    spec_file: DARE/cycles/005-synthetic-mcp-security-lab/EXECUTION/task-002.md
    subtask_prompt: |
      Execute Cycle 005 task-002: versioned scenario manifest/schema (metadata, property, MCP revision, variants, verdict, safety, standards). Positive and negative schema tests.

  - id: task-003
    title: "Build shared synthetic lab framework"
    depends_on: [task-001, task-002]
    complexity: HIGH
    spec_file: DARE/cycles/005-synthetic-mcp-security-lab/EXECUTION/task-003.md
    subtask_prompt: |
      Execute Cycle 005 task-003: shared local-only lab primitives (identities, credentials, policy, state, startup/teardown, reset). No real network for security semantics.

  - id: task-004
    title: "Implement passive discovery and authorization-presence scenarios"
    depends_on: [task-002, task-003]
    complexity: HIGH
    spec_file: DARE/cycles/005-synthetic-mcp-security-lab/EXECUTION/task-004.md
    subtask_prompt: |
      Execute Cycle 005 task-004: MCP-LAB-001 and MCP-LAB-002 with secure + vulnerable variants, expected evidence, and tests.

  - id: task-005
    title: "Implement confused-deputy scenario"
    depends_on: [task-002, task-003]
    complexity: HIGH
    spec_file: DARE/cycles/005-synthetic-mcp-security-lab/EXECUTION/task-005.md
    subtask_prompt: |
      Execute Cycle 005 task-005: MCP-LAB-003 confused deputy — secure authority binding vs vulnerable privileged reuse.

  - id: task-006
    title: "Implement authorization-integrity mutation scenarios"
    depends_on: [task-002, task-003]
    complexity: HIGH
    spec_file: DARE/cycles/005-synthetic-mcp-security-lab/EXECUTION/task-006.md
    subtask_prompt: |
      Execute Cycle 005 task-006: MCP-LAB-004/005/006 mutation scenarios. Reuse Cycle 003 binding/canonicalization — do not rebuild.

  - id: task-007
    title: "Implement modern MCP routing and authorization scenarios"
    depends_on: [task-002, task-003]
    complexity: HIGH
    spec_file: DARE/cycles/005-synthetic-mcp-security-lab/EXECUTION/task-007.md
    subtask_prompt: |
      Execute Cycle 005 task-007: MCP-LAB-007/008/009 modern MCP routing/auth scenarios. Synthetic/local only; correct standards status mapping.

  - id: task-008
    title: "Implement MRTR authorization-mutation scenario"
    depends_on: [task-002, task-003, task-006]
    complexity: HIGH
    spec_file: DARE/cycles/005-synthetic-mcp-security-lab/EXECUTION/task-008.md
    subtask_prompt: |
      Execute Cycle 005 task-008: MCP-LAB-010 MRTR authorization mutation — secure re-eval vs vulnerable stale authorization.

  - id: task-009
    title: "Build scenario runner and evidence assertions"
    depends_on: [task-004, task-005, task-006, task-007, task-008]
    complexity: HIGH
    spec_file: DARE/cycles/005-synthetic-mcp-security-lab/EXECUTION/task-009.md
    subtask_prompt: |
      Execute Cycle 005 task-009: thin runner loading manifests, selecting variants, invoking DARE engine, comparing evidence. expected FAIL + observed FAIL = assertion PASS.

  - id: task-010
    title: "Integrate full corpus with Cycle 004 CI gate"
    depends_on: [task-009]
    complexity: HIGH
    spec_file: DARE/cycles/005-synthetic-mcp-security-lab/EXECUTION/task-010.md
    subtask_prompt: |
      Execute Cycle 005 task-010: run full corpus through Cycle 004 CI path. Secure PASS / vulnerable FAIL; no real credentials/network; stable repeats.

  - id: task-011
    title: "Add hostile-fixture and isolation tests"
    depends_on: [task-003, task-009]
    complexity: HIGH
    spec_file: DARE/cycles/005-synthetic-mcp-security-lab/EXECUTION/task-011.md
    subtask_prompt: |
      Execute Cycle 005 task-011: isolation and hostile-fixture tests (leakage, ordering, malformed manifest, traversal, network, secrets, teardown). Fail closed.

  - id: task-012
    title: "Documentation, scenario catalog, and final DARE proof"
    depends_on: [task-010, task-011]
    complexity: MED
    spec_file: DARE/cycles/005-synthetic-mcp-security-lab/EXECUTION/task-012.md
    subtask_prompt: |
      Execute Cycle 005 task-012: lab README, scenario catalog, standards mapping, limitations, PROOF.md. No prevalence/production coverage claim.
