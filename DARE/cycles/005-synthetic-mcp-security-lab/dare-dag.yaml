  task-003:
    title: "Build shared synthetic lab framework"
    depends_on: ["task-001", "task-002"]
  task-004:
    title: "Implement passive discovery and authorization-presence scenarios"
    depends_on: ["task-002", "task-003"]
  task-005:
    title: "Implement confused-deputy scenario"
    depends_on: ["task-002", "task-003"]
  task-006:
    title: "Implement authorization-integrity mutation scenarios"
    depends_on: ["task-002", "task-003"]
  task-007:
    title: "Implement modern MCP routing and authorization scenarios"
    depends_on: ["task-002", "task-003"]
  task-008:
    title: "Implement MRTR authorization-mutation scenario"
    depends_on: ["task-002", "task-003", "task-006"]
  task-009:
