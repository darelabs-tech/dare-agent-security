  approval: "APPROVED"

dependencies:
  delivered_cycles:
    - "001"
    - "002"
    - "003"
    - "004"

gates:
  - "cargo fmt --all --check"
  - "cargo clippy --workspace --all-targets -- -D warnings"
  - "cargo test --workspace"

invariants:
  - "synthetic/local fixtures only"
  - "reuse Cycles 001-004 contracts — no second evidence/CI/integrity engine"
  - "secure + vulnerable variants per security property"
  - "no real credentials or production network for security semantics"
  - "expected FAIL + observed FAIL = scenario assertion PASS"

tasks:
