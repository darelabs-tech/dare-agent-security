title: "DARE Agent Security Cycle 004 - CI Security Gate"
version: "1.0.0"
cycle: "004-ci-security-gate"
source_design: "DARE/cycles/004-ci-security-gate/DESIGN.md"
source_blueprint: "DARE/cycles/004-ci-security-gate/BLUEPRINT.md"
source_tasks: "DARE/cycles/004-ci-security-gate/TASKS.md"
limits:
  parent_context_chars: 2000
  task_output_chars: 4000
  timeout_seconds: 1800
rules:
  execution_mode: "execute-only"
  require_design_conformance: true
  require_blueprint_conformance: true
  require_anti_stub_review: true
  fail_closed_on_unknown_schema_major: true
  forbid_customer_specific_fields: true
  forbid_raw_credentials: true
  required_gates:
    - "cargo fmt --all --check"
    - "cargo clippy --workspace --all-targets -- -D warnings"
    - "cargo test --workspace"
tasks:
  - id: task-001
    title: "Reconcile post-Cycle-003 main"
    depends_on: []
    complexity: MED
    spec_file: DARE/cycles/004-ci-security-gate/EXECUTION/task-001.md
    subtask_prompt: |
      Execute Cycle 004 task-001 exactly as defined in DARE/cycles/004-ci-security-gate/EXECUTION/task-001.md.
      Inspect merged Cycle 003 on main: CLI commands, evidence schema, fixtures, CI, MSRV. Produce IMPLEMENTATION-NOTES.md with paths for tasks 002-011.
      Stop and report if Cycle 003 acceptance is missing from main.

  - id: task-002
    title: "Define deterministic CI result contract"
    depends_on: [task-001]
    complexity: HIGH
    spec_file: DARE/cycles/004-ci-security-gate/EXECUTION/task-002.md
    subtask_prompt: |
      Execute Cycle 004 task-002: CI result contract (modes, aggregate verdict PASS/FAIL/INCONCLUSIVE/ERROR, output dirs, GitHub outputs). No GitHub-specific security verdicts invented.

  - id: task-003
    title: "Verify Action packaging architecture and threat model"
    depends_on: [task-001]
    complexity: HIGH
    spec_file: DARE/cycles/004-ci-security-gate/EXECUTION/task-003.md
    subtask_prompt: |
      Execute Cycle 004 task-003: evaluate Docker container Action packaging, threat model, permissions, entrypoint surface. Document architecture decision before implementation.

  - id: task-004
    title: "Make the CLI CI-safe and non-interactive"
    depends_on: [task-002]
    complexity: HIGH
    spec_file: DARE/cycles/004-ci-security-gate/EXECUTION/task-004.md
    subtask_prompt: |
      Execute Cycle 004 task-004: minimal CLI additive changes for machine output path, aggregate verdict, stable non-interactive exits. Do not break discover/validate commands.

  - id: task-005
    title: "Implement the thin GitHub Action adapter"
    depends_on: [task-002, task-003]
    complexity: HIGH
    spec_file: DARE/cycles/004-ci-security-gate/EXECUTION/task-005.md
    subtask_prompt: |
      Execute Cycle 004 task-005: action.yml + Dockerfile/entrypoint invoking CLI only. Bounded mode enum, explicit target, no eval, no arbitrary passthrough, no write token.

  - id: task-006
    title: "Integrate evidence outputs and job summary"
    depends_on: [task-004, task-005]
    complexity: HIGH
    spec_file: DARE/cycles/004-ci-security-gate/EXECUTION/task-006.md
    subtask_prompt: |
      Execute Cycle 004 task-006: GitHub outputs (verdict, evidence path), GITHUB_STEP_SUMMARY, secret-safe evidence handoff.

  - id: task-007
    title: "Build synthetic Action fixtures"
    depends_on: [task-002, task-004]
    complexity: MED
    spec_file: DARE/cycles/004-ci-security-gate/EXECUTION/task-007.md
    subtask_prompt: |
      Execute Cycle 004 task-007: synthetic fixtures PASS/FAIL/INCONCLUSIVE/ERROR reusing Cycle 002/003 labs where possible.

  - id: task-008
    title: "Add Action E2E workflow matrix"
    depends_on: [task-006, task-007]
    complexity: HIGH
    spec_file: DARE/cycles/004-ci-security-gate/EXECUTION/task-008.md
    subtask_prompt: |
      Execute Cycle 004 task-008: .github/workflows invoking uses: ./ action locally. Assert pass/fail/error/inconclusive, evidence on disk, outputs match.

  - id: task-009
    title: "Security hardening and hostile-input tests"
    depends_on: [task-003, task-005, task-006]
    complexity: HIGH
    spec_file: DARE/cycles/004-ci-security-gate/EXECUTION/task-009.md
    subtask_prompt: |
      Execute Cycle 004 task-009: hostile-input tests (shell metacharacters, path traversal, unknown mode, secret canaries). Inputs remain data.

  - id: task-010
    title: "Documentation and project-state reconciliation"
    depends_on: [task-008, task-009]
    complexity: MED
    spec_file: DARE/cycles/004-ci-security-gate/EXECUTION/task-010.md
    subtask_prompt: |
      Execute Cycle 004 task-010: docs for Action usage, permissions, pinning, example workflow. Reconcile README/ROADMAP with Cycles 001-003 delivered. No Marketplace claim.

  - id: task-011
    title: "Final DARE proof and release-candidate handoff"
    depends_on: [task-010]
    complexity: MED
    spec_file: DARE/cycles/004-ci-security-gate/EXECUTION/task-011.md
    subtask_prompt: |
      Execute Cycle 004 task-011: PROOF.md mapping Design acceptance criteria. Confirm no approval bypass, no domain duplication in Action, no stable-release claim.
