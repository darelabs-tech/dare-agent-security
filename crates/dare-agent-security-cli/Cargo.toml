[package]
name = "dare-agent-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for DARE Agent Security"
publish = false

[[bin]]
name = "dare-agent-security"
path = "src/main.rs"

[lib]
name = "dare_agent_security"
path = "src/lib.rs"

[dependencies]
clap = { workspace = true }
dare-coaz-integrity = { path = "../dare-coaz-integrity" }
dare-mcp-discovery = { path = "../dare-mcp-discovery" }
dare-security-evidence = { path = "../dare-security-evidence" }
dare-coverage = { path = "../dare-coverage" }
dare-benchmark = { path = "../dare-benchmark" }
dare-attack-graph = { path = "../dare-attack-graph" }
dare-adversarial = { path = "../dare-adversarial" }
dare-continuous = { path = "../dare-continuous" }
jsonschema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2.0"
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
dare-coaz-integrity = { path = "../dare-coaz-integrity" }
dare-mcp-discovery = { path = "../dare-mcp-discovery" }
serde_json = { workspace = true }
tempfile = "3.14"
