[package]
name = "dare-mcp-auth-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded, evidence-first, offline MCP 2026 authentication and authorization hardening validation (Cycle 018)"
publish = false

[lib]
name = "dare_mcp_auth_security"
path = "src/lib.rs"

# No HTTP client, no OAuth client, no JWT/JWKS library and no TLS stack appears
# here or transitively. That absence is the security boundary: several of the
# documents this cycle evaluates against describe endpoints an implementation is
# supposed to call, and there is no dependency through which this crate could
# reach one.
[dependencies]
dare-adversarial = { path = "../dare-adversarial" }
dare-coaz-integrity = { path = "../dare-coaz-integrity" }
dare-coverage = { path = "../dare-coverage" }
dare-identity-security = { path = "../dare-identity-security" }
dare-mcp-discovery = { path = "../dare-mcp-discovery" }
dare-security-evidence = { path = "../dare-security-evidence" }
jsonschema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = "2.0"
time = { workspace = true }

[dev-dependencies]
tempfile = "3.14"
