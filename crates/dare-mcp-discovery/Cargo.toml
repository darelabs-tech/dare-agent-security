[package]
name = "dare-mcp-discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Passive MCP discovery library for DARE Agent Security"
publish = false

[lib]
name = "dare_mcp_discovery"
path = "src/lib.rs"

[dependencies]
dare-security-evidence = { path = "../dare-security-evidence" }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
time = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util", "io-util"] }
rmcp = { workspace = true, features = [
    "client",
    "server",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "transport-async-rw",
] }
synthetic-mcp = { path = "../../labs/synthetic-mcp" }
