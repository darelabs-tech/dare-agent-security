[workspace]
resolver = "2"
members = [
    "crates/dare-security-evidence",
    "crates/dare-mcp-discovery",
    "crates/dare-coaz-integrity",
    "crates/dare-agent-security-cli",
    "crates/dare-mcp-lab",
    "crates/dare-coverage",
    "crates/dare-benchmark",
    "crates/dare-attack-graph",
    "crates/dare-adversarial",
    "labs/synthetic-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/darelabs-tech/dare-agent-security"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
jsonschema = { version = "0.37", default-features = false }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "time", "process", "io-util", "sync"] }
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
sha2 = "0.10"
futures = "0.3"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.1.3", default-features = false, features = [
    "client",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
